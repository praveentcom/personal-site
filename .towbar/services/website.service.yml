# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: praveen-website
name: Praveen Website
deployment:
  type: dockerfile
  dockerfile: Dockerfile
  context: .
  resources:
    cpus: 2
    memory: 4g
vulnerabilityScanning: true
autoDeploy:
  inputs:
    - Dockerfile
    - .dockerignore
    - .npmrc
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - next.config.ts
    - postcss.config.mjs
    - tsconfig.json
    - src/**
    - public/**
    - content/**
    - data/**
container:
  port: 3000
  resources:
    cpus: 0.5
    memory: 512m
health:
  path: /api/health
  timeoutSeconds: 90
domains:
  primary: www.praveent.com
tls:
  mode: cloudflare-dns
analytics:
  enabled: true
  pageviews: true
  visitorIdentity: true
  retentionDays: 30
  excludePaths:
    - /api/health
secrets:
  build:
    - NPM_READ_TOKEN
    - HUGEICONS_LICENSE_KEY
    - HEROUI_AUTH_TOKEN
    - NEXT_PUBLIC_BASE_URL
    - NEXT_PUBLIC_ALLOW_ROBOTS
    - NEXT_PUBLIC_TOWBAR_ANALYTICS
environments:
  production:
    server: 13.204.184.47
