# yaml-language-server: $schema=https://towbar.dev/schemas/deployment.v1.json
version: 1
source:
  branch: main
apps:
  - id: praveen-website
    name: Praveen Website
    server: 13.126.178.68
    dockerfile: Dockerfile
    context: .
    vulnerabilityScanning: true
    autoDeploy:
      inputs:
        - Dockerfile
        - .dockerignore
        - .npmrc
        - package.json
        - pnpm-lock.yaml
        - patches/**
        - pnpm-workspace.yaml
        - next.config.ts
        - postcss.config.mjs
        - tsconfig.json
        - src/**
        - public/**
        - content/**
        - data/**
    container:
      port: 3000
      resources:
        cpus: 0.5
        memory: 1g
    health:
      path: /api/health
      timeoutSeconds: 90
    domains:
      primary: www.praveent.com
    tls:
      mode: cloudflare-dns
