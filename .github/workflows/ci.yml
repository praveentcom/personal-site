name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Build and smoke-test production container
        run: |
          docker build -t praveen-website:test .
          docker run -d --name website-test -p 3000:3000 praveen-website:test
          trap 'docker logs website-test; docker rm -f website-test' EXIT
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 5 http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/ > /dev/null
